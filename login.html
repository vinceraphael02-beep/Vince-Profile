<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Personal Profile</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #243047;
            background: #f2f5fa;
        }

        .login-box {
            width: min(400px, 100%);
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(22, 44, 75, 0.10);
        }

        h1 {
            margin-top: 0;
            color: #194b78;
            text-align: center;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: bold;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 11px;
            border: 1px solid #b8c5d4;
            border-radius: 7px;
            font-size: 16px;
        }

        input[type="submit"] {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: 0;
            border-radius: 7px;
            background: #21659a;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #174b75;
        }

        .note {
            margin-bottom: 0;
            color: #5b6878;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Login form -->
    <main class="login-box">
        <h1>Welcome</h1>
        <p>Please enter a username and password to continue to the profile page.</p>

        <!-- The required attributes prevent submission when a field is empty. -->
        <form action="profile.html" method="get">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <input type="submit" value="Login">
        </form>

    </main>
</body>
</html>
